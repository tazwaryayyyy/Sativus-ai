<!DOCTYPE html>
<html lang="en" data-mode="doctor">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sativus â€” Plant Doctor & Nature Explorer</title>
  <meta name="description" content="Multimodal plant doctor and nature explorer powered by vision AI">
  <meta name="theme-color" content="#0E1512">
  <link rel="manifest" href="/manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <style>
    /* â”€â”€â”€ Design System â”€â”€â”€ */
    :root {
      --bg-deep: #070C09;
      --bg: #0E1512;
      --bg-raised: #152420;
      --bg-card: #1A2E26;
      --bg-card-hover: #213A31;

      --fg: #E8E0D0;
      --fg-dim: #A8B5A4;
      --fg-muted: #607A6C;

      --border: #283F33;
      --border-subtle: #1E3229;

      --accent: #C9A227;
      --accent-soft: rgba(201, 162, 39, 0.10);
      --accent-mid: rgba(201, 162, 39, 0.22);
      --accent-glow: rgba(201, 162, 39, 0.35);

      --healthy: #4CAF7D;
      --warning: #D4943A;
      --critical: #C45550;
      --info: #4A9EC4;

      --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
      --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', monospace;

      --radius-xs: 2px;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 14px;

      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --dur-fast: 120ms;
      --dur-normal: 280ms;
      --dur-slow: 500ms;
    }

    [data-mode="explorer"] {
      --accent: #2EAD64;
      --accent-soft: rgba(46, 173, 100, 0.10);
      --accent-mid: rgba(46, 173, 100, 0.22);
      --accent-glow: rgba(46, 173, 100, 0.35);
    }

    [data-mode="critical"] {
      --accent: #C45550;
      --accent-soft: rgba(196, 85, 80, 0.10);
      --accent-mid: rgba(196, 85, 80, 0.22);
      --accent-glow: rgba(196, 85, 80, 0.35);
    }

    /* â”€â”€â”€ Reset â”€â”€â”€ */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--fg);
      min-height: 100dvh;
      overflow-x: hidden;
      line-height: 1.55;
    }

    /* â”€â”€â”€ Noise Texture â”€â”€â”€ */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      opacity: 0.028;
      pointer-events: none;
      z-index: 10000;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px;
    }

    /* â”€â”€â”€ Scrollbar â”€â”€â”€ */
    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--fg-muted);
    }

    /* â”€â”€â”€ Typography â”€â”€â”€ */
    .font-display {
      font-family: var(--font-display);
    }

    .font-mono {
      font-family: var(--font-mono);
    }

    /* â”€â”€â”€ App Shell â”€â”€â”€ */
    #app {
      max-width: 1440px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* â”€â”€â”€ Header â”€â”€â”€ */
    .app-header {
      padding: 20px 28px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
    }

    .app-header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 28px;
      width: 60px;
      height: 1px;
      background: var(--accent);
      transition: background var(--dur-normal) var(--ease-out);
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 26px;
      letter-spacing: -0.02em;
      color: var(--fg);
      line-height: 1;
    }

    .brand-name span {
      color: var(--accent);
      transition: color var(--dur-normal) var(--ease-out);
    }

    .brand-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* â”€â”€â”€ Mode Toggle â”€â”€â”€ */
    .mode-toggle {
      display: flex;
      background: var(--bg-raised);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 3px;
      position: relative;
    }

    .mode-btn {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.03em;
      padding: 7px 16px;
      border: none;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--fg-muted);
      cursor: pointer;
      transition: all var(--dur-normal) var(--ease-out);
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .mode-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mode-btn.active {
      color: var(--bg-deep);
      background: var(--accent);
    }

    .mode-btn.active svg {
      stroke: var(--bg-deep);
    }

    .mode-btn:not(.active):hover {
      color: var(--fg-dim);
      background: var(--accent-soft);
    }

    /* â”€â”€â”€ Voice Button â”€â”€â”€ */
    .voice-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--bg-raised);
      color: var(--fg-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--dur-normal) var(--ease-out);
      position: relative;
    }

    .voice-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .voice-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .voice-btn.active {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--bg-deep);
      animation: voicePulse 2s ease-in-out infinite;
    }

    @keyframes voicePulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 var(--accent-glow);
      }

      50% {
        box-shadow: 0 0 0 10px transparent;
      }
    }

    /* â”€â”€â”€ Main Layout â”€â”€â”€ */
    .app-main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 0;
      overflow: hidden;
    }

    /* â”€â”€â”€ Scan Panel â”€â”€â”€ */
    .scan-panel {
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    /* â”€â”€â”€ Viewfinder â”€â”€â”€ */
    .viewfinder-wrapper {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
    }

    .viewfinder {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: var(--bg-deep);
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }

    .viewfinder video,
    .viewfinder canvas,
    .viewfinder img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .viewfinder video {
      transform: scaleX(-1);
    }

    /* Viewfinder Overlay */
    .vf-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    /* Corner Brackets */
    .vf-corner {
      position: absolute;
      width: 32px;
      height: 32px;
    }

    .vf-corner::before,
    .vf-corner::after {
      content: '';
      position: absolute;
      background: var(--accent);
      transition: background var(--dur-normal) var(--ease-out), opacity var(--dur-slow) var(--ease-out);
    }

    .vf-tl {
      top: 16px;
      left: 16px;
    }

    .vf-tl::before {
      top: 0;
      left: 0;
      width: 32px;
      height: 2px;
    }

    .vf-tl::after {
      top: 0;
      left: 0;
      width: 2px;
      height: 32px;
    }

    .vf-tr {
      top: 16px;
      right: 16px;
    }

    .vf-tr::before {
      top: 0;
      right: 0;
      width: 32px;
      height: 2px;
    }

    .vf-tr::after {
      top: 0;
      right: 0;
      width: 2px;
      height: 32px;
    }

    .vf-bl {
      bottom: 16px;
      left: 16px;
    }

    .vf-bl::before {
      bottom: 0;
      left: 0;
      width: 32px;
      height: 2px;
    }

    .vf-bl::after {
      bottom: 0;
      left: 0;
      width: 2px;
      height: 32px;
    }

    .vf-br {
      bottom: 16px;
      right: 16px;
    }

    .vf-br::before {
      bottom: 0;
      right: 0;
      width: 32px;
      height: 2px;
    }

    .vf-br::after {
      bottom: 0;
      right: 0;
      width: 2px;
      height: 32px;
    }

    /* Breathing animation when camera is active */
    .viewfinder.camera-on .vf-corner::before,
    .viewfinder.camera-on .vf-corner::after {
      opacity: 0.6;
      animation: cornerBreathe 4s ease-in-out infinite;
    }

    @keyframes cornerBreathe {

      0%,
      100% {
        opacity: 0.5;
      }

      50% {
        opacity: 1;
      }
    }

    /* Crosshair */
    .vf-crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 28px;
      height: 28px;
      margin: -14px 0 0 -14px;
      opacity: 0;
      transition: opacity var(--dur-slow) var(--ease-out);
    }

    .viewfinder.camera-on .vf-crosshair {
      opacity: 0.35;
      animation: crosshairSpin 30s linear infinite;
    }

    .vf-crosshair::before,
    .vf-crosshair::after {
      content: '';
      position: absolute;
      background: var(--accent);
      transition: background var(--dur-normal) var(--ease-out);
    }

    .vf-crosshair::before {
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      margin-top: -0.5px;
    }

    .vf-crosshair::after {
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      margin-left: -0.5px;
    }

    @keyframes crosshairSpin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* Scan Line */
    .vf-scanline {
      position: absolute;
      left: 10%;
      right: 10%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0;
      z-index: 3;
      filter: blur(0.5px);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .viewfinder.scanning .vf-scanline {
      opacity: 1;
      animation: scanSweep 2.2s ease-in-out infinite;
    }

    @keyframes scanSweep {
      0% {
        top: 12%;
        opacity: 0;
      }

      8% {
        opacity: 1;
      }

      92% {
        opacity: 1;
      }

      100% {
        top: 88%;
        opacity: 0;
      }
    }

    /* Ripple Rings */
    .vf-ripple {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      margin: -20px 0 0 -20px;
      border: 1.5px solid var(--accent);
      border-radius: 50%;
      opacity: 0;
      z-index: 3;
    }

    .viewfinder.scanning .vf-ripple {
      animation: rippleExpand 2.5s ease-out infinite;
    }

    .viewfinder.scanning .vf-ripple:nth-child(2) {
      animation-delay: 0.8s;
    }

    .viewfinder.scanning .vf-ripple:nth-child(3) {
      animation-delay: 1.6s;
    }

    @keyframes rippleExpand {
      0% {
        transform: scale(0.5);
        opacity: 0.5;
      }

      100% {
        transform: scale(5);
        opacity: 0;
      }
    }

    /* Viewfinder Placeholder */
    .vf-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 1;
    }

    .vf-placeholder-icon {
      width: 48px;
      height: 48px;
      stroke: var(--fg-muted);
      fill: none;
      stroke-width: 1.5;
      opacity: 0.4;
    }

    .vf-placeholder-text {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg-muted);
      opacity: 0.6;
    }

    .viewfinder.camera-on .vf-placeholder {
      display: none;
    }

    /* Status Pill */
    .vf-status {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.6);
      color: var(--fg-dim);
      backdrop-filter: blur(8px);
      transition: all var(--dur-normal) var(--ease-out);
    }

    .vf-status.scanning {
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid var(--accent-mid);
    }

    /* Capture Flash */
    .vf-flash {
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      z-index: 5;
      pointer-events: none;
    }

    .vf-flash.fire {
      animation: flashFire 300ms ease-out;
    }

    @keyframes flashFire {
      0% {
        opacity: 0.7;
      }

      100% {
        opacity: 0;
      }
    }

    /* â”€â”€â”€ Action Bar â”€â”€â”€ */
    .action-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 9px 20px;
      border-radius: var(--radius-sm);
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: all var(--dur-fast) var(--ease-out);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      outline: none;
      position: relative;
      overflow: hidden;
    }

    .btn:focus-visible {
      box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
    }

    .btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--bg-deep);
      border-color: var(--accent);
    }

    .btn-primary:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px var(--accent-mid);
    }

    .btn-primary:active {
      transform: translateY(0);
      filter: brightness(0.95);
    }

    .btn-secondary {
      background: transparent;
      color: var(--accent);
      border-color: var(--accent);
    }

    .btn-secondary:hover {
      background: var(--accent-soft);
    }

    .btn-secondary:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    .btn-ghost {
      background: transparent;
      color: var(--fg-dim);
      border-color: var(--border);
    }

    .btn-ghost:hover {
      color: var(--fg);
      border-color: var(--fg-muted);
      background: var(--bg-raised);
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: none;
    }

    .btn.loading {
      pointer-events: none;
      color: transparent;
    }

    .btn.loading::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-radius: 50%;
      animation: btnSpinner 0.6s linear infinite;
    }

    .btn-primary.loading::after {
      border-top-color: var(--bg-deep);
    }

    @keyframes btnSpinner {
      to {
        transform: rotate(360deg);
      }
    }

    /* Hidden file input */
    .file-input {
      display: none;
    }

    /* â”€â”€â”€ Results Panel â”€â”€â”€ */
    .results-panel {
      max-width: 640px;
      margin: 0 auto;
      width: 100%;
    }

    .results-empty {
      text-align: center;
      padding: 32px 20px;
      color: var(--fg-muted);
      font-size: 13px;
    }

    .results-empty svg {
      width: 36px;
      height: 36px;
      stroke: var(--border);
      fill: none;
      stroke-width: 1.5;
      margin-bottom: 10px;
      display: inline-block;
    }

    /* Skeleton */
    .results-skeleton {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .skel-line {
      height: 13px;
      background: var(--border-subtle);
      border-radius: var(--radius-xs);
      animation: skelPulse 1.6s ease-in-out infinite;
    }

    .skel-line.w60 {
      width: 60%;
    }

    .skel-line.w40 {
      width: 40%;
    }

    .skel-line.w80 {
      width: 80%;
    }

    .skel-line.w100 {
      width: 100%;
    }

    .skel-line.h20 {
      height: 20px;
    }

    @keyframes skelPulse {

      0%,
      100% {
        opacity: 0.3;
      }

      50% {
        opacity: 0.55;
      }
    }

    /* Result Card */
    .result-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      animation: resultSlideIn 0.5s var(--ease-out) both;
    }

    @keyframes resultSlideIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-header {
      padding: 20px 24px 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .result-species {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .result-common-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 22px;
      line-height: 1.2;
      color: var(--fg);
    }

    .result-sci-name {
      font-style: italic;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 14px;
      color: var(--fg-dim);
    }

    .result-family {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--fg-muted);
      text-transform: uppercase;
    }

    .result-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 20px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .result-badge.healthy {
      background: rgba(76, 175, 125, 0.12);
      color: var(--healthy);
      border: 1px solid rgba(76, 175, 125, 0.25);
    }

    .result-badge.warning {
      background: rgba(212, 148, 58, 0.12);
      color: var(--warning);
      border: 1px solid rgba(212, 148, 58, 0.25);
    }

    .result-badge.critical {
      background: rgba(196, 85, 80, 0.12);
      color: var(--critical);
      border: 1px solid rgba(196, 85, 80, 0.25);
    }

    .result-badge.identified {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--accent-mid);
    }

    .result-badge svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .result-body {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .result-section-title {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--fg-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .result-section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-subtle);
    }

    .result-diagnosis {
      font-size: 14px;
      line-height: 1.65;
      color: var(--fg-dim);
    }

    .result-treatment {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result-treatment li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--fg-dim);
    }

    .treatment-num {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--accent);
      background: var(--accent-soft);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .result-reminder {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-mid);
      border-radius: var(--radius-md);
    }

    .result-reminder svg {
      width: 18px;
      height: 18px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
    }

    .result-reminder-text {
      font-size: 13px;
      color: var(--fg-dim);
      flex: 1;
    }

    .result-reminder-text strong {
      color: var(--accent);
    }

    .result-reminder .btn {
      padding: 5px 12px;
      font-size: 11px;
    }

    /* Confidence bar */
    .confidence-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .confidence-track {
      flex: 1;
      height: 3px;
      background: var(--border-subtle);
      border-radius: 2px;
      overflow: hidden;
    }

    .confidence-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.8s var(--ease-out);
    }

    .confidence-label {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--fg-muted);
      white-space: nowrap;
    }

    /* â”€â”€â”€ Journal Panel â”€â”€â”€ */
    .journal-panel {
      border-left: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-raised);
    }

    .journal-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .journal-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 18px;
      color: var(--fg);
      margin-bottom: 2px;
    }

    .journal-count {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--fg-muted);
      letter-spacing: 0.06em;
    }

    /* Stats */
    .stats-row {
      display: flex;
      gap: 1px;
      margin-top: 14px;
      background: var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .stat-item {
      flex: 1;
      padding: 10px 12px;
      background: var(--bg-card);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-value {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 20px;
      color: var(--fg);
      line-height: 1;
    }

    .stat-label {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--fg-muted);
    }

    /* Journal Entries */
    .journal-entries {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .journal-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
      gap: 12px;
    }

    .journal-empty-svg {
      width: 56px;
      height: 56px;
      stroke: var(--border);
      fill: none;
      stroke-width: 1.2;
      opacity: 0.5;
    }

    .journal-empty-title {
      font-family: var(--font-display);
      font-weight: 500;
      font-style: italic;
      font-size: 15px;
      color: var(--fg-muted);
    }

    .journal-empty-sub {
      font-size: 12px;
      color: var(--fg-muted);
      opacity: 0.6;
      max-width: 200px;
      line-height: 1.5;
    }

    /* Specimen Card */
    .specimen-card {
      display: flex;
      gap: 12px;
      padding: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--dur-normal) var(--ease-out);
      position: relative;
      animation: specimenIn 0.4s var(--ease-out) both;
    }

    .specimen-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border);
      transform: translateX(3px);
    }

    /* Pushpin */
    .specimen-card::before {
      content: '';
      position: absolute;
      top: -3px;
      left: 50%;
      margin-left: -3px;
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 4px var(--accent-glow);
      transition: background var(--dur-normal) var(--ease-out), box-shadow var(--dur-normal) var(--ease-out);
    }

    @keyframes specimenIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .specimen-thumb {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      flex-shrink: 0;
      background: var(--bg-deep);
    }

    .specimen-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .specimen-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .specimen-name {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 14px;
      color: var(--fg);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .specimen-health {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .specimen-health.healthy {
      color: var(--healthy);
    }

    .specimen-health.warning {
      color: var(--warning);
    }

    .specimen-health.critical {
      color: var(--critical);
    }

    .specimen-health.identified {
      color: var(--accent);
    }

    .specimen-date {
      font-size: 11px;
      color: var(--fg-muted);
    }

    .specimen-delete {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 20px;
      height: 20px;
      border: none;
      background: transparent;
      color: var(--fg-muted);
      cursor: pointer;
      opacity: 0;
      transition: all var(--dur-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-xs);
    }

    .specimen-card:hover .specimen-delete {
      opacity: 0.6;
    }

    .specimen-delete:hover {
      opacity: 1 !important;
      background: var(--accent-soft);
      color: var(--critical);
    }

    .specimen-delete svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    /* â”€â”€â”€ Voice Overlay â”€â”€â”€ */
    .voice-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(7, 12, 9, 0.85);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all var(--dur-slow) var(--ease-out);
    }

    .voice-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .voice-card {
      width: 420px;
      max-width: 90vw;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      transform: scale(0.92) translateY(20px);
      transition: transform var(--dur-slow) var(--ease-spring);
    }

    .voice-overlay.active .voice-card {
      transform: scale(1) translateY(0);
    }

    .voice-mic-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all var(--dur-normal) var(--ease-out);
    }

    .voice-mic-btn svg {
      width: 32px;
      height: 32px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .voice-mic-btn.listening {
      background: var(--accent);
      color: var(--bg-deep);
      animation: micListening 1.5s ease-in-out infinite;
    }

    @keyframes micListening {

      0%,
      100% {
        box-shadow: 0 0 0 0 var(--accent-glow);
      }

      50% {
        box-shadow: 0 0 0 20px transparent;
      }
    }

    .voice-mic-btn.speaking {
      background: var(--accent);
      color: var(--bg-deep);
    }

    .voice-status-text {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--fg-muted);
      text-align: center;
    }

    .voice-transcript {
      width: 100%;
      max-height: 160px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.6;
      color: var(--fg-dim);
      text-align: center;
      padding: 12px;
      background: var(--bg-deep);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
    }

    .voice-waves {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 24px;
    }

    .voice-wave-bar {
      width: 3px;
      height: 8px;
      background: var(--accent);
      border-radius: 2px;
      transition: height 0.1s ease;
    }

    .voice-waves.active .voice-wave-bar {
      animation: waveBar 0.8s ease-in-out infinite;
    }

    .voice-wave-bar:nth-child(1) {
      animation-delay: 0s;
    }

    .voice-wave-bar:nth-child(2) {
      animation-delay: 0.1s;
    }

    .voice-wave-bar:nth-child(3) {
      animation-delay: 0.2s;
    }

    .voice-wave-bar:nth-child(4) {
      animation-delay: 0.3s;
    }

    .voice-wave-bar:nth-child(5) {
      animation-delay: 0.4s;
    }

    .voice-wave-bar:nth-child(6) {
      animation-delay: 0.3s;
    }

    .voice-wave-bar:nth-child(7) {
      animation-delay: 0.2s;
    }

    @keyframes waveBar {

      0%,
      100% {
        height: 4px;
      }

      50% {
        height: 20px;
      }
    }

    .voice-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--bg-raised);
      color: var(--fg-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--dur-fast);
    }

    .voice-close:hover {
      border-color: var(--critical);
      color: var(--critical);
    }

    .voice-close svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    /* â”€â”€â”€ Toast â”€â”€â”€ */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      padding: 12px 18px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      color: var(--fg);
      background: var(--bg-card);
      border: 1px solid var(--border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      animation: toastIn 0.35s var(--ease-spring) both;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 360px;
    }

    .toast.success {
      border-color: var(--healthy);
    }

    .toast.warning {
      border-color: var(--warning);
    }

    .toast.error {
      border-color: var(--critical);
    }

    .toast.exiting {
      animation: toastOut 0.3s var(--ease-out) both;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes toastOut {
      from {
        opacity: 1;
        transform: translateY(0);
      }

      to {
        opacity: 0;
        transform: translateY(-8px);
      }
    }

    /* â”€â”€â”€ Reminders Section â”€â”€â”€ */
    .reminders-section {
      padding: 16px 24px;
      border-top: 1px solid var(--border-subtle);
    }

    .reminders-title {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg-muted);
      margin-bottom: 10px;
    }

    .reminder-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--bg-card);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
      font-size: 12px;
    }

    .reminder-item svg {
      width: 14px;
      height: 14px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
    }

    .reminder-plant {
      color: var(--fg);
      font-weight: 500;
      flex: 1;
    }

    .reminder-schedule {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--fg-muted);
    }

    /* â”€â”€â”€ Mobile Journal Toggle â”€â”€â”€ */
    .mobile-journal-toggle {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--bg-deep);
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--accent-mid);
      z-index: 100;
      align-items: center;
      justify-content: center;
      transition: transform var(--dur-fast) var(--ease-spring);
    }

    .mobile-journal-toggle:active {
      transform: scale(0.9);
    }

    .mobile-journal-toggle svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    /* â”€â”€â”€ Responsive â”€â”€â”€ */
    @media (max-width: 1023px) {
      .app-main {
        grid-template-columns: 1fr;
      }

      .journal-panel {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 340px;
        max-width: 85vw;
        z-index: 500;
        border-left: 1px solid var(--border);
        transform: translateX(100%);
        transition: transform var(--dur-slow) var(--ease-out);
      }

      .journal-panel.open {
        transform: translateX(0);
      }

      .mobile-journal-toggle {
        display: flex;
      }

      .mobile-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 499;
        opacity: 0;
        visibility: hidden;
        transition: all var(--dur-normal);
      }

      .mobile-backdrop.open {
        opacity: 1;
        visibility: visible;
      }

      .scan-panel {
        padding: 20px 16px;
      }

      .app-header {
        padding: 16px;
      }

      .brand-name {
        font-size: 22px;
      }

      .mode-btn {
        padding: 6px 12px;
        font-size: 11px;
      }
    }

    @media (max-width: 480px) {
      .viewfinder {
        aspect-ratio: 3 / 4;
      }

      .action-bar {
        gap: 8px;
      }

      .btn {
        padding: 8px 14px;
        font-size: 12px;
      }

      .result-header {
        padding: 16px;
      }

      .result-body {
        padding: 16px;
      }

      .result-common-name {
        font-size: 18px;
      }
    }

    /* â”€â”€â”€ Reduced Motion â”€â”€â”€ */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* â”€â”€â”€ Background Ambience â”€â”€â”€ */
    .bg-glow {
      position: fixed;
      pointer-events: none;
      z-index: -1;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.08;
      transition: background var(--dur-slow) var(--ease-out);
    }

    .bg-glow-1 {
      width: 600px;
      height: 600px;
      top: -200px;
      right: -100px;
      background: var(--accent);
    }

    .bg-glow-2 {
      width: 400px;
      height: 400px;
      bottom: -100px;
      left: -50px;
      background: var(--accent);
      opacity: 0.05;
    }

    /* â”€â”€â”€ Explorer-specific result styles â”€â”€â”€ */
    .result-conservation {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .result-conservation.lc {
      background: rgba(76, 175, 125, 0.1);
      color: var(--healthy);
    }

    .result-conservation.nt {
      background: rgba(212, 148, 58, 0.1);
      color: var(--warning);
    }

    .result-conservation.vu,
    .result-conservation.en,
    .result-conservation.cr {
      background: rgba(196, 85, 80, 0.1);
      color: var(--critical);
    }

    .inat-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--fg-muted);
      margin-top: 4px;
    }

    .inat-link svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }
  </style>
</head>

<body>
  <!-- Background Ambience -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-name">Sativus<span>.</span></div>
        <div class="brand-tag">Plant Doctor &middot; Nature Explorer</div>
      </div>
      <div class="header-actions">
        <div class="mode-toggle" role="tablist" aria-label="Application mode">
          <button class="mode-btn active" data-mode="doctor" role="tab" aria-selected="true">
            <svg viewBox="0 0 24 24">
              <path
                d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83" />
            </svg>
            Doctor
          </button>
          <button class="mode-btn" data-mode="explorer" role="tab" aria-selected="false">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" />
              <path d="M12 2a15 15 0 0 1 0 20m0-20a15 15 0 0 0 0 20M2 12h20" />
            </svg>
            Explorer
          </button>
        </div>
        <button class="voice-btn" id="voiceToggle" aria-label="Voice interaction" title="Voice Interaction">
          <svg viewBox="0 0 24 24">
            <path d="M12 1a4 4 0 0 0-4 4v7a4 4 0 0 0 8 0V5a4 4 0 0 0-4-4z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" y1="19" x2="12" y2="23" />
            <line x1="8" y1="23" x2="16" y2="23" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-main">
      <!-- Left: Scan Panel -->
      <section class="scan-panel">
        <!-- Viewfinder -->
        <div class="viewfinder-wrapper">
          <div class="viewfinder" id="viewfinder">
            <video id="cameraVideo" autoplay playsinline muted></video>
            <canvas id="captureCanvas" style="display:none;"></canvas>

            <div class="vf-overlay">
              <div class="vf-corner vf-tl"></div>
              <div class="vf-corner vf-tr"></div>
              <div class="vf-corner vf-bl"></div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    /* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
       Sativus AI â€” Frontend Application
       â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */

    (function () {
      'use strict';

      // â”€â”€â”€ State â”€â”€â”€
      const state = {
        mode: 'doctor',
        cameraOn: false,
        scanning: false,
        voiceActive: false,
        voiceListening: false,
        voiceSpeaking: false,
        journal: [],
        reminders: [],
        stats: { scanned: 0, treated: 0, species: 0 },
        speciesSet: new Set(),
        lastCapture: null,
        ws: null,
        audioCtx: null,
        audioQueue: [],
        isPlayingAudio: false
      };

      // â”€â”€â”€ DOM â”€â”€â”€
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => document.querySelectorAll(s);

      const dom = {
        viewfinder: $('#viewfinder'),
        video: $('#cameraVideo'),
        canvas: $('#captureCanvas'),
        vfStatus: $('#vfStatus'),
        vfFlash: $('#vfFlash'),
        vfPlaceholder: $('#vfPlaceholder'),
        btnStart: $('#btnStart'),
        btnAnalyse: $('#btnAnalyse'),
        btnUpload: $('#btnUpload'),
        fileInput: $('#fileInput'),
        resultsPanel: $('#resultsPanel'),
        resultsEmpty: $('#resultsEmpty'),
        journalPanel: $('#journalPanel'),
        journalEntries: $('#journalEntries'),
        journalEmpty: $('#journalEmpty'),
        journalCount: $('#journalCount'),
        statScanned: $('#statScanned'),
        statTreated: $('#statTreated'),
        statSpecies: $('#statSpecies'),
        voiceToggle: $('#voiceToggle'),
        voiceOverlay: $('#voiceOverlay'),
        voiceMicBtn: $('#voiceMicBtn'),
        voiceClose: $('#voiceClose'),
        voiceStatusText: $('#voiceStatusText'),
        voiceTranscript: $('#voiceTranscript'),
        voiceWaves: $('#voiceWaves'),
        mobileJournalToggle: $('#mobileJournalToggle'),
        mobileBackdrop: $('#mobileBackdrop'),
        toastContainer: $('#toastContainer'),
        remindersSection: $('#remindersSection'),
        remindersList: $('#remindersList')
      };

      // â”€â”€â”€ Utilities â”€â”€â”€
      function formatDate(d) {
        return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      }

      function toast(msg, type = 'success') {
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        el.textContent = msg;
        dom.toastContainer.appendChild(el);
        setTimeout(() => {
          el.classList.add('exiting');
          setTimeout(() => el.remove(), 300);
        }, 3200);
      }

      function resizeImage(base64, maxW = 1024) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(c.toDataURL('image/jpeg', 0.85));
          };
          img.src = base64;
        });
      }

      // â”€â”€â”€ Mode Toggle â”€â”€â”€
      function setMode(mode) {
        state.mode = mode;
        document.documentElement.setAttribute('data-mode', mode);
        $$('.mode-btn').forEach(b => {
          const isActive = b.dataset.mode === mode;
          b.classList.toggle('active', isActive);
          b.setAttribute('aria-selected', isActive);
        });
        // Clear results when switching modes
        if (dom.resultsPanel.querySelector('.result-card')) {
          showResultsEmpty();
        }
      }

      $$('.mode-btn').forEach(btn => {
        btn.addEventListener('click', () => setMode(btn.dataset.mode));
      });

      // â”€â”€â”€ Camera â”€â”€â”€
      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 960 } }
          });
          dom.video.srcObject = stream;
          state.cameraOn = true;
          dom.viewfinder.classList.add('camera-on');
          dom.vfPlaceholder.style.display = 'none';
          dom.vfStatus.textContent = 'Camera active';
          dom.btnStart.innerHTML = `<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> Stop`;
          dom.btnAnalyse.disabled = false;
          toast('Camera started', 'success');
        } catch (err) {
          toast('Camera access denied', 'error');
          console.error('Camera error:', err);
        }
      }

      function stopCamera() {
        if (dom.video.srcObject) {
          dom.video.srcObject.getTracks().forEach(t => t.stop());
          dom.video.srcObject = null;
        }
        state.cameraOn = false;
        dom.viewfinder.classList.remove('camera-on');
        dom.vfPlaceholder.style.display = '';
        dom.vfStatus.textContent = 'Standby';
        dom.btnStart.innerHTML = `<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg> Start`;
        dom.btnAnalyse.disabled = true;
      }

      dom.btnStart.addEventListener('click', () => {
        if (state.cameraOn) stopCamera();
        else startCamera();
      });

      // â”€â”€â”€ Capture â”€â”€â”€
      function captureFrame() {
        const v = dom.video;
        const c = dom.canvas;
        c.width = v.videoWidth || 640;
        c.height = v.videoHeight || 480;
        const ctx = c.getContext('2d');
        ctx.save();
        ctx.translate(c.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(v, 0, 0, c.width, c.height);
        ctx.restore();
        return c.toDataURL('image/jpeg', 0.85);
      }

      // â”€â”€â”€ Analysis â”€â”€â”€
      async function analyseImage(base64Data) {
        if (state.scanning) return;
        state.scanning = true;

        dom.viewfinder.classList.add('scanning');
        dom.vfStatus.textContent = 'Analysing';
        dom.vfStatus.classList.add('scanning');
        dom.btnAnalyse.classList.add('loading');

        // Flash effect
        dom.vfFlash.classList.add('fire');
        setTimeout(() => dom.vfFlash.classList.remove('fire'), 350);

        // Show skeleton
        showSkeleton();

        try {
          const resized = await resizeImage(base64Data);
          state.lastCapture = resized;

          const response = await fetch('/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              image: resized,
              mode: state.mode,
              gps: await getGPS()
            })
          });

          if (!response.ok) throw new Error(`Server returned ${response.status}`);

          const data = await response.json();
          renderResult(data);
          addToJournal(data, resized);
          updateStats(data);
        } catch (err) {
          console.warn('Backend unavailable, using demo data:', err.message);
          // Demo mode â€” show mock results
          const mockData = getMockResult();
          setTimeout(() => {
            renderResult(mockData);
            addToJournal(mockData, state.lastCapture || base64Data);
            updateStats(mockData);
          }, 1200);
        } finally {
          state.scanning = false;
          dom.viewfinder.classList.remove('scanning');
          dom.vfStatus.textContent = 'Camera active';
          dom.vfStatus.classList.remove('scanning');
          dom.btnAnalyse.classList.remove('loading');
        }
      }

      dom.btnAnalyse.addEventListener('click', () => {
        if (!state.cameraOn || state.scanning) return;
        const frame = captureFrame();
        analyseImage(frame);
      });

      // â”€â”€â”€ File Upload â”€â”€â”€
      dom.btnUpload.addEventListener('click', () => dom.fileInput.click());

      dom.fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => analyseImage(reader.result);
        reader.readAsDataURL(file);
        dom.fileInput.value = '';
      });

      // â”€â”€â”€ GPS â”€â”€â”€
      async function getGPS() {
        return new Promise((resolve) => {
          if (!navigator.geolocation) return resolve(null);
          navigator.geolocation.getCurrentPosition(
            (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
            () => resolve(null),
            { timeout: 3000 }
          );
        });
      }

      // â”€â”€â”€ Mock Data â”€â”€â”€
      function getMockResult() {
        if (state.mode === 'doctor') {
          return {
            species: { common_name: "Swiss Cheese Plant", scientific_name: "Monstera deliciosa", family: "Araceae", confidence: 0.94 },
            health: { status: "warning", diagnosis: "Early signs of overwatering detected. Lower leaves show yellowing with soft dark spots. Soil appears excessively moist, risking root rot if untreated.", treatment: ["Allow top 5cm of soil to dry completely before next watering", "Improve drainage by mixing perlite or orchid bark into the soil", "Remove severely affected leaves to redirect the plant's energy", "Ensure the pot has unblocked drainage holes â€” consider elevating it"], watering_schedule: "Every 10-14 days" }
          };
        } else {
          return {
            species: { common_name: "Swiss Cheese Plant", scientific_name: "Monstera deliciosa", family: "Araceae", confidence: 0.94 },
            natural_history: "Native to the tropical rainforests of southern Mexico to Panama. In the wild, Monstera deliciosa climbs tree trunks using aerial roots, reaching heights up to 20 metres. The iconic leaf fenestrations are believed to allow light through to lower leaves and help the plant withstand heavy rain and wind in its canopy habitat.",
            conservation_status: "LC",
            field_notes: "Found in humid understory environments. The mature fruit is edible, described as tasting like a blend of banana, pineapple, and mango â€” but contains calcium oxalate crystals when unripe. Widely cultivated as a houseplant since the Victorian era.",
            inat_observations: 12847
          };
        }
      }

      // â”€â”€â”€ Render Results â”€â”€â”€
      function renderResult(data) {
        const sp = data.species;
        const confidencePct = Math.round((sp.confidence || 0) * 100);

        if (state.mode === 'doctor') {
          renderDoctorResult(sp, data.health, confidencePct);
        } else {
          renderExplorerResult(sp, data, confidencePct);
        }
      }

      function renderDoctorResult(sp, health, conf) {
        const statusClass = health.status || 'healthy';
        const statusLabel = statusClass === 'healthy' ? 'Healthy' : statusClass === 'warning' ? 'Needs Attention' : 'Critical';

        // Apply critical theme if needed
        if (statusClass === 'critical') {
          document.documentElement.setAttribute('data-mode', 'critical');
        }

        const treatmentHTML = (health.treatment || []).map((step, i) =>
          `<li><span class="treatment-num">${i + 1}</span><span>${step}</span></li>`
        ).join('');

        const reminderHTML = health.watering_schedule ? `
                <div class="result-reminder">
                    <svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                    <div class="result-reminder-text">Water <strong>${health.watering_schedule}</strong></div>
                    <button class="btn btn-secondary" onclick="window.sativusApp.setReminder('${sp.common_name}','${health.watering_schedule}')">Set Reminder</button>
                </div>
            ` : '';

        dom.resultsPanel.innerHTML = `
                <div class="result-card">
                    <div class="result-header">
                        <div class="result-species">
                            <div class="result-common-name">${sp.common_name}</div>
                            <div class="result-sci-name">${sp.scientific_name}</div>
                            <div class="result-family">${sp.family}</div>
                            <div class="confidence-bar">
                                <div class="confidence-track"><div class="confidence-fill" style="width:${conf}%"></div></div>
                                <div class="confidence-label">${conf}% match</div>
                            </div>
                        </div>
                        <div class="result-badge ${statusClass}">
                            <svg viewBox="0 0 24 24">
                              <${statusClass === 'healthy' ? 'path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"' : statusClass === 'warning' ? 'path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"' : 'circle cx="12" cy="12" r="10"'} stroke="currentColor" fill="none" stroke-width="2"/>
                              <${statusClass === 'healthy' ? 'polyline points="22 4 12 14.01 9 11.01"' : statusClass === 'warning' ? 'line x1="12" y1="9" x2="12" y2="13"' : 'line x1="12" y1="8" x2="12" y2="12"'} stroke="currentColor" fill="none" stroke-width="2"/>
                              <${statusClass === 'warning' ? 'line x1="12" y1="17" x2="12.01" y2="17"' : statusClass === 'critical' ? 'line x1="12" y1="16" x2="12.01" y2="16"' : 'path d=""'} stroke="currentColor" fill="none" stroke-width="2"/>
                            </svg>
                            ${statusLabel}
                        </div>
                    </div>
                    <div class="result-body">
                        <div>
                            <div class="result-section-title">Diagnosis</div>
                            <div class="result-diagnosis">${health.diagnosis}</div>
                        </div>
                        ${treatmentHTML ? `
                        <div>
                            <div class="result-section-title">Treatment Plan</div>
                            <ol class="result-treatment">${treatmentHTML}</ol>
                        </div>` : ''}
                        ${reminderHTML}
                    </div>
                </div>
            `;
      }

      function renderExplorerResult(sp, data, conf) {
        const cs = data.conservation_status || 'LC';
        const csLabels = { LC: 'Least Concern', NT: 'Near Threatened', VU: 'Vulnerable', EN: 'Endangered', CR: 'Critically Endangered' };
        const csClass = cs === 'LC' ? 'lc' : cs === 'NT' ? 'nt' : 'vu';

        dom.resultsPanel.innerHTML = `
                <div class="result-card">
                    <div class="result-header">
                        <div class="result-species">
                            <div class="result-common-name">${sp.common_name}</div>
                            <div class="result-sci-name">${sp.scientific_name}</div>
                            <div class="result-family">${sp.family}</div>
                            <div class="confidence-bar">
                                <div class="confidence-track"><div class="confidence-fill" style="width:${conf}%"></div></div>
                                <div class="confidence-label">${conf}% match</div>
                            </div>
                        </div>
                        <div class="result-badge identified">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a15 15 0 0 1 0 20m0-20a15 15 0 0 0 0 20M2 12h20" stroke="currentColor" fill="none" stroke-width="2"/></svg>
                            Identified
                        </div>
                    </div>
                    <div class="result-body">
                        <div>
                            <div class="result-section-title">Natural History</div>
                            <div class="result-diagnosis">${data.natural_history || ''}</div>
                        </div>
                        <div>
                            <div class="result-section-title">Conservation Status</div>
                            <span class="result-conservation ${csClass}">${csLabels[cs] || cs}</span>
                        </div>
                        ${data.field_notes ? `
                        <div>
                            <div class="result-section-title">Field Notes</div>
                            <div class="result-diagnosis">${data.field_notes}</div>
                        </div>` : ''}
                        ${data.inat_observations ? `
                        <div class="inat-link">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                            ${data.inat_observations.toLocaleString()} observations on iNaturalist
                        </div>` : ''}
                    </div>
                </div>
            `;
      }

      function showSkeleton() {
        dom.resultsPanel.innerHTML = `
                <div class="results-skeleton">
                    <div class="skel-line h20 w60"></div>
                    <div class="skel-line w40"></div>
                    <div class="skel-line w80"></div>
                    <div class="skel-line w100"></div>
                    <div class="skel-line w60"></div>
                    <div class="skel-line w100"></div>
                    <div class="skel-line w40"></div>
                </div>
            `;
      }

      function showResultsEmpty() {
        dom.resultsPanel.innerHTML = `
                <div class="results-empty">
                    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                    <div>Scan results will appear here</div>
                </div>
            `;
      }

      // â”€â”€â”€ Journal â”€â”€â”€
      function loadJournal() {
        try {
          const raw = localStorage.getItem('sativus_journal');
          state.journal = raw ? JSON.parse(raw) : [];
        } catch { state.journal = []; }
        renderJournal();
      }

      function saveJournal() {
        localStorage.setItem('sativus_journal', JSON.stringify(state.journal));
      }

      function addToJournal(data, imageData) {
        const entry = {
          id: Date.now(),
          mode: state.mode,
          species: data.species,
          date: new Date().toISOString(),
          thumbnail: imageData || null,
          health: data.health || null,
          natural_history: data.natural_history || null,
          conservation_status: data.conservation_status || null
        };
        state.journal.unshift(entry);
        if (state.journal.length > 50) state.journal = state.journal.slice(0, 50);
        saveJournal();
        renderJournal();
      }

      function renderJournal() {
        const entries = state.journal;
        dom.journalCount.textContent = `${entries.length} ${entries.length === 1 ? 'entry' : 'entries'}`;

        if (entries.length === 0) {
          dom.journalEntries.innerHTML = `
                    <div class="journal-empty">
                        <svg class="journal-empty-svg" viewBox="0 0 24 24">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                            <line x1="9" y1="7" x2="15" y2="7"/>
                            <line x1="9" y1="11" x2="13" y2="11"/>
                        </svg>
                        <div class="journal-empty-title">Your journal awaits</div>
                        <div class="journal-empty-sub">Scan specimens to build your field collection</div>
                    </div>
                `;
          return;
        }

        dom.journalEntries.innerHTML = entries.map((entry, idx) => {
          const sp = entry.species;
          const statusClass = entry.mode === 'doctor'
            ? (entry.health?.status || 'healthy')
            : 'identified';
          const statusLabel = entry.mode === 'doctor'
            ? (statusClass === 'healthy' ? 'Healthy' : statusClass === 'warning' ? 'Needs Attention' : statusClass === 'critical' ? 'Critical' : 'Healthy')
            : 'Identified';
          const thumbStyle = entry.thumbnail
            ? `background-image:url(${entry.thumbnail});background-size:cover;background-position:center;`
            : '';

          return `
                    <div class="specimen-card" style="animation-delay:${idx * 50}ms" data-id="${entry.id}">
                        <div class="specimen-thumb" style="${thumbStyle}">
                            ${!entry.thumbnail ? `<svg viewBox="0 0 24 24" style="width:24px;height:24px;stroke:var(--fg-muted);fill:none;stroke-width:1.5;margin:14px auto;display:block;opacity:0.4;"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>` : ''}
                        </div>
                        <div class="specimen-info">
                            <div class="specimen-name">${sp.common_name}</div>
                            <div class="specimen-health ${statusClass}">${statusLabel}</div>
                            <div class="specimen-date">${formatDate(entry.date)}</div>
                        </div>
                        <button class="specimen-delete" onclick="window.sativusApp.deleteEntry(${entry.id})" aria-label="Delete entry">
                            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>
                `;
        }).join('');
      }

      function deleteEntry(id) {
        state.journal = state.journal.filter(e => e.id !== id);
        saveJournal();
        renderJournal();
        toast('Entry removed from journal');
      }

      // â”€â”€â”€ Stats â”€â”€â”€
      function loadStats() {
        try {
          const raw = localStorage.getItem('sativus_stats');
          if (raw) {
            const s = JSON.parse(raw);
            state.stats = s.stats || state.stats;
            state.speciesSet = new Set(s.species || []);
          }
        } catch { }
        renderStats();
      }

      function saveStats() {
        localStorage.setItem('sativus_stats', JSON.stringify({
          stats: state.stats,
          species: [...state.speciesSet]
        }));
      }

      function updateStats(data) {
        state.stats.scanned++;
        if (state.mode === 'doctor' && data.health && data.health.status !== 'healthy') {
          state.stats.treated++;
        }
        const sciName = data.species.scientific_name;
        if (!state.speciesSet.has(sciName)) {
          state.speciesSet.add(sciName);
          state.stats.species = state.speciesSet.size;
        }
        saveStats();
        renderStats();
      }

      function renderStats() {
        dom.statScanned.textContent = state.stats.scanned;
        dom.statTreated.textContent = state.stats.treated;
        dom.statSpecies.textContent = state.stats.species;
      }

      // â”€â”€â”€ Reminders â”€â”€â”€
      function loadReminders() {
        try {
          const raw = localStorage.getItem('sativus_reminders');
          state.reminders = raw ? JSON.parse(raw) : [];
        } catch { state.reminders = []; }
        renderReminders();
      }

      function saveReminders() {
        localStorage.setItem('sativus_reminders', JSON.stringify(state.reminders));
      }

      function setReminder(plant, schedule) {
        // Parse natural language schedule
        const days = parseSchedule(schedule);
        const reminder = {
          id: Date.now(),
          plant: plant,
          schedule: schedule,
          days: days,
          nextWater: new Date(Date.now() + days * 86400000).toISOString()
        };
        state.reminders.push(reminder);
        saveReminders();
        renderReminders();
        toast(`Reminder set: water ${plant} every ${schedule}`);
      }

      function parseSchedule(text) {
        const lower = (text || '').toLowerCase();
        const numMatch = lower.match(/(\d+)/);
        const num = numMatch ? parseInt(numMatch[1]) : 7;
        if (lower.includes('day')) return num;
        if (lower.includes('week')) return num * 7;
        if (lower.includes('month')) return num * 30;
        return 7; // default
      }

      function renderReminders() {
        if (state.reminders.length === 0) {
          dom.remindersSection.style.display = 'none';
          return;
        }
        dom.remindersSection.style.display = '';
        dom.remindersList.innerHTML = state.reminders.map(r => `
                <div class="reminder-item">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span class="reminder-plant">${r.plant}</span>
                    <span class="reminder-schedule">${r.schedule}</span>
                </div>
            `).join('');
      }

      // â”€â”€â”€ Voice â”€â”€â”€
      function toggleVoice() {
        if (state.voiceActive) {
          closeVoice();
        } else {
          openVoice();
        }
      }

      function openVoice() {
        state.voiceActive = true;
        dom.voiceOverlay.classList.add('active');
        dom.voiceToggle.classList.add('active');
        dom.voiceStatusText.textContent = 'Tap microphone to speak';
        dom.voiceTranscript.style.display = 'none';
        dom.voiceTranscript.textContent = '';
        dom.voiceWaves.classList.remove('active');
        dom.voiceMicBtn.classList.remove('listening', 'speaking');
      }

      function closeVoice() {
        state.voiceActive = false;
        state.voiceListening = false;
        state.voiceSpeaking = false;
        dom.voiceOverlay.classList.remove('active');
        dom.voiceToggle.classList.remove('active');
        if (state.ws) {
          state.ws.close();
          state.ws = null;
        }
        dom.voiceMicBtn.classList.remove('listening', 'speaking');
        dom.voiceWaves.classList.remove('active');
      }

      async function startListening() {
        try {
          const wsUrl = `ws://${window.location.host}/voice`;
          const ws = new WebSocket(wsUrl);
          state.ws = ws;

          ws.onopen = () => {
            state.voiceListening = true;
            dom.voiceMicBtn.classList.add('listening');
            dom.voiceWaves.classList.add('active');
            dom.voiceStatusText.textContent = 'Listening...';
            startMicStream(ws);
          };

          ws.onmessage = (event) => {
            if (event.data instanceof Blob) {
              // Audio response chunk
              handleAudioChunk(event.data);
            } else {
              try {
                const msg = JSON.parse(event.data);
                if (msg.transcript) {
                  dom.voiceTranscript.style.display = '';
                  dom.voiceTranscript.textContent += msg.transcript + ' ';
                }
                if (msg.type === 'response_start') {
                  state.voiceListening = false;
                  state.voiceSpeaking = true;
                  dom.voiceMicBtn.classList.remove('listening');
                  dom.voiceMicBtn.classList.add('speaking');
                  dom.voiceStatusText.textContent = 'Responding...';
                }
                if (msg.type === 'response_end') {
                  state.voiceSpeaking = false;
                  dom.voiceMicBtn.classList.remove('speaking');
                  dom.voiceWaves.classList.remove('active');
                  dom.voiceStatusText.textContent = 'Tap microphone to speak';
                }
              } catch { }
            }
          };

          ws.onerror = () => {
            toast('Voice connection failed', 'error');
            closeVoice();
          };

          ws.onclose = () => {
            if (state.voiceActive) {
              dom.voiceStatusText.textContent = 'Connection closed. Tap to retry.';
              state.voiceListening = false;
              dom.voiceMicBtn.classList.remove('listening');
              dom.voiceWaves.classList.remove('active');
            }
          };

        } catch (err) {
          toast('Voice not available', 'error');
          console.error('Voice error:', err);
        }
      }

      async function startMicStream(ws) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1 } });
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
          state.audioCtx = audioCtx;
          const source = audioCtx.createMediaStreamSource(stream);
          const processor = audioCtx.createScriptProcessor(4096, 1, 1);

          processor.onaudioprocess = (e) => {
            if (ws.readyState === WebSocket.OPEN && state.voiceListening) {
              const float32 = e.inputBuffer.getChannelData(0);
              const int16 = new Int16Array(float32.length);
              for (let i = 0; i < float32.length; i++) {
                int16[i] = Math.max(-32768, Math.min(32767, float32[i] * 32768));
              }
              ws.send(int16.buffer);
            }
          };

          source.connect(processor);
          processor.connect(audioCtx.destination);
        } catch (err) {
          toast('Microphone access denied', 'error');
          console.error('Mic error:', err);
        }
      }

      async function handleAudioChunk(blob) {
        state.audioQueue.push(blob);
        if (!state.isPlayingAudio) playNextAudio();
      }

      async function playNextAudio() {
        if (state.audioQueue.length === 0) {
          state.isPlayingAudio = false;
          return;
        }
        state.isPlayingAudio = true;
        const chunk = state.audioQueue.shift();
        const url = URL.createObjectURL(new Blob([chunk], { type: 'audio/mpeg' }));
        const audio = new Audio(url);
        audio.onended = () => {
          URL.revokeObjectURL(url);
          playNextAudio();
        };
        audio.onerror = () => playNextAudio();
        try {
          await audio.play();
        } catch (e) {
          playNextAudio();
        }
      }

      function stopVoice() {
        state.voiceActive = false;
        state.voiceListening = false;
        state.voiceSpeaking = false;
        dom.voiceOverlay.classList.remove('active');
        if (state.ws) {
          state.ws.close();
          state.ws = null;
        }
        state.audioQueue = [];
        state.isPlayingAudio = false;
      }

      dom.voiceClose.addEventListener('click', stopVoice);

      // ─── Initialization ───
      function init() {
        setMode('doctor');
        // Load journal from localstorage if exists
        const saved = localStorage.getItem('sativus_journal');
        if (saved) {
          state.journal = JSON.parse(saved);
          renderJournal();
        }
        updateStats();
      }

      init();

      // Export for inline handlers
      window.sativusApp = {
        setReminder: (name, schedule) => {
          toast(`Reminder set for ${name}: ${schedule}`);
        }
      };

    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => { }));
    }
  </script>
</body>
</html>
